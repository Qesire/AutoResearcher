name: Research protocol validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate illustrative states
        run: |
          python scripts/validate.py examples/research_state.json
          python scripts/validate.py examples/deduction_only_state.json
      - name: Validate optional representation ledger
        run: python scripts/validate_representation.py examples/representation_ledger.json
      - name: Run semantic regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
